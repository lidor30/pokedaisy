# Every PR (and every push to main) must pass these before it can merge - make them
# required checks in the main branch's protection rule (docs/RELEASING.md).
# The Release workflow runs the same jobs again on the tagged commit (workflow_call).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # Its default list includes the legacy "tools" package, which the SDK
          # repository no longer has (sdkmanager fails on it).
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: NDK + CMake (app/build.gradle.kts pins them)
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Translations
        run: python3 scripts/check_translations.py

      # The per-game code generated from gamedata/ must match it (gamedata/README.md).
      - name: Game data
        run: python3 scripts/gen_gamedata.py --check

      # ROM-backed tests skip here (no ROMs in CI - they run on the release runner);
      # fixtures, guards, Paparazzi renders and everything else run.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug APK (Kotlin + the native mGBA / rcheevos build)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  ui-preview:
    name: UI preview + stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # No `render` here: its PNGs are for looking at (`make preview`), nothing checks them, and it ran past
      # the job's timeout. Stress compiles the real UI sources against desktop Compose, so a change that
      # breaks ui-preview (the only preview in cloud sessions) still fails here.
      # Rapid tab switching against memory / time budgets (ui-preview/src/render/Stress.kt).
      - name: Stress
        run: ./gradlew -p ui-preview stress --stacktrace

      # The app's docs search ranks website/test/docsearch-cases.json like the website's.
      - name: Docs search
        run: ./gradlew -p ui-preview docsSearchCheck --stacktrace

      # produceKeyedState starts over when its keys change (GitHub #229), on the bare Compose runtime.
      - name: Keyed state
        run: ./gradlew -p ui-preview keyedStateCheck --stacktrace

  # The manual (docs/manual): every page draws in both readers, links and screenshots resolve, no dashes,
  # and every setting the app has is documented (website/test/docs.test.js) - so a PR that adds a setting
  # without its docs fails here.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: node --test test/docs.test.js test/docsearch.test.js
      - run: npm run build
