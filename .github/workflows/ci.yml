# Every PR (and every push to main) must pass these before it can merge - make them
# required checks in the main branch's protection rule (docs/RELEASING.md).
# The Release workflow runs the same jobs again on the tagged commit (workflow_call).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit / branch to test (Nightly passes dev's head); empty = the event's own ref
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      # This job builds without n3ds. Keep the optional Azahar tree (and its unrelated Android wrappers) out;
      # required submodules remain recursive and setup-gradle still validates every checked-out wrapper.
      - name: Native dependencies (default features)
        run: git -c submodule.third_party/azahar.update=none submodule update --init --recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # Its default list includes the legacy "tools" package, which the SDK
          # repository no longer has (sdkmanager fails on it).
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: NDK + CMake (app/build.gradle.kts pins them)
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34"

      # Every Gradle wrapper jar in the checkout is validated here instead of by setup-gradle, which can't accept one
      # checksum: the recursive checkout brings Azahar's SDL, whose Android sample project carries a wrapper jar Gradle
      # doesn't list. Nothing runs it (Azahar builds with CMake, and only behind the n3ds flag).
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          min-wrapper-count: 2
          allow-checksums: 2c23278a62dc9f96ab11bee897d9f53e6479d6419135e4560ce822a6431df5e5  # third_party/azahar/externals/sdl2/SDL/android-project

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: false

      - name: Translations
        run: python3 scripts/check_translations.py

      # The per-game code generated from gamedata/ must match it (gamedata/README.md).
      - name: Game data
        run: python3 scripts/gen_gamedata.py --check && python3 scripts/gen_nds_ports.py --check && python3 scripts/gen_area_maps.py --check

      # ROM-backed tests skip here (no ROMs in CI - they run on the release runner);
      # fixtures, guards, Paparazzi renders and everything else run.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :shared:testDebugUnitTest :shared-ui:testDebugUnitTest --stacktrace

      - name: Debug APK (Kotlin + the native mGBA / rcheevos build)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
            shared-ui/build/reports/tests/
          retention-days: 7

  # The companion's data and language code (shared/) for the iPad, with the emulator core under it (pk_api.h through
  # cinterop: shared/native/build_ios_core.sh needs Xcode, so a Mac), and the core run in the iPad simulator on the
  # diagnostic ROMs (PkApiCoreTest). Advisory for now (the iPad plan): make it required once it has held for a while.
  ios-shared:
    name: Shared code for iOS
    # PRs and pushes only: the Release and Nightly workflows call this file too (workflow_call, where github.workflow
    # is the caller's), and an advisory job mustn't hold back a signed release.
    if: github.workflow == 'CI'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      - run: git submodule update --init third_party/mgba

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      # shared/ is an Android library too, so Gradle configures it with the SDK (no NDK needed here).
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Compile for iOS (iPad, iPad simulator), the core included
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --stacktrace

      # Also commonTest's portable platform checks: a KLIB compile alone doesn't exercise Native APIs.
      - name: The core and the platform checks in the iPad simulator
        run: ./gradlew :shared:iosSimulatorArm64Test :shared-ui:iosSimulatorArm64Test --stacktrace

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/tests/
            shared-ui/build/reports/tests/
          retention-days: 7

  # The iPad app: the companion's screens (shared-ui/) compiled for the iPad, then iosApp/'s XcodeGen project built
  # for the simulator with no signing. Its build runs Gradle, which links the screens, the data code and the
  # emulator core into the PokeDaisyUI framework. A Mac, as the core needs Xcode (advisory for now).
  ios-app:
    name: iPad app (simulator build)
    # PRs and pushes only: the Release and Nightly workflows call this file too (workflow_call, where github.workflow
    # is the caller's), and an advisory job mustn't hold back a signed release.
    if: github.workflow == 'CI'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      - run: git submodule update --init third_party/mgba

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Compile the screens for the iPad
        run: ./gradlew :shared-ui:compileKotlinIosArm64 --stacktrace

      - name: Generate the Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen

      - name: Build for the iPad simulator
        run: >-
          xcodebuild -project iosApp/PokeDaisy.xcodeproj -scheme PokeDaisy -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO build

  ui-preview:
    name: UI preview + stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # No `render` here: its PNGs are for looking at (`make preview`), nothing checks them, and it ran past
      # the job's timeout. Stress compiles the real UI sources against desktop Compose, so a change that
      # breaks ui-preview (the only preview in cloud sessions) still fails here.
      # Rapid tab switching against memory / time budgets (ui-preview/src/render/Stress.kt).
      - name: Stress
        run: ./gradlew -p ui-preview stress --stacktrace

      # The app's docs search ranks website/test/docsearch-cases.json like the website's.
      - name: Docs search
        run: ./gradlew -p ui-preview docsSearchCheck --stacktrace

      # produceKeyedState starts over when its keys change (GitHub #229), on the bare Compose runtime.
      - name: Keyed state
        run: ./gradlew -p ui-preview keyedStateCheck --stacktrace

  # The emulator core's plain C API (app/src/main/cpp/pk_api.h) built off Android, as the iPad app builds it, and run
  # on linux/make_diagnostic.py's ROMs: a JNI dependency or an Android-only call in it fails here.
  core-api:
    name: Core C API (host)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - run: git submodule update --init third_party/mgba
      - run: cmake -S app/src/main/cpp/test -B "$RUNNER_TEMP/pk_api" -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - run: cmake --build "$RUNNER_TEMP/pk_api" -j4
      - run: ctest --test-dir "$RUNNER_TEMP/pk_api" --output-on-failure

  # The manual (docs/manual): every page draws in both readers, links and screenshots resolve, no dashes,
  # and every setting the app has is documented (website/test/docs.test.js) - so a PR that adds a setting
  # without its docs fails here.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: node --test test/docs.test.js test/docsearch.test.js
      - run: npm run build
