# Tests the co-op relay (server/coop-relay) and deploys it to its Google Cloud VM. Pull requests that touch the
# relay only run the tests; a push to main deploys whatever changed there, and a manual run deploys main again.
# The cloud side is made once by server/coop-relay/deploy/gcp/setup.sh, which also creates the "coop-relay"
# environment (main only) and its variables. Sign-in is keyless (Workload Identity Federation): no secret here.
# To roll back, re-run an older run's jobs: it builds and deploys that commit.
name: Co-op relay

on:
  push:
    branches: [main]
    paths: ['server/coop-relay/**', '.github/workflows/coop-relay.yml']
  pull_request:
    paths: ['server/coop-relay/**', '.github/workflows/coop-relay.yml']
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commits, not tags: a moved tag can't run new code with the deploy account.
# Bump them by hand (the comment names the release).
concurrency:
  # Deploys queue up, never cancel each other halfway; pull requests just keep their newest run.
  group: coop-relay-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew --no-daemon -p server/coop-relay test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: coop-relay
      url: https://${{ vars.RELAY_HOST }}/healthz
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: server/coop-relay/deploy/gcp/deploy.sh
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          ZONE: ${{ vars.GCP_ZONE }}
          VM: ${{ vars.RELAY_VM }}
          RELAY_HOST: ${{ vars.RELAY_HOST }}
