# Japanese Emerald (BPEJ): its own build - every RAM global and the battle code
# moved (English's literal pools, matched word for word), the structs didn't:
# English's save loads with the same party bytes, money and position, and a
# scripted wild battle reads with English's BattlePokemon / gMain layouts
# (emerald_ja / emerald_ja_battle, headless; the action / move / bag / party
# handlers checked there). Its names are kana (EmeraldText 'J', Gen3Text's
# Japanese table). No TRAINER CARD, and the party slot is the app's own (its
# fonts aren't the Western ones the slot art is drawn with).
[config.emerald_ja]
base = 'emerald_retail'
itemDescs = { preset = 'japanese', base = 0x0855CEE8 }
actionCursor = 0
moveCursor = 0  # its RAM moved; not located yet
language = 'J'
gameCode = 'BPEJ'
trainerCard = 'none'
playerParty = 0x02024190
playerPartyCount = 0x0202418D
battleMons = 0x02023D28
battlerPositions = 0x02023D1A
battlersCount = 0x02023D10
battleTypeFlags = 0x02022C90
battlerPartyIndexes = 0x02023D12
battleStructPtr = 0x02024140
enemyParty = 0x020243E8
gMain = 0x03002360
saveBlock1Ptr = 0x03005AEC
saveBlock2Ptr = 0x03005AF0
pokemonStoragePtr = 0x03005AF4  # BOXES: gSaveBlock2Ptr + 4, as in English (`emerald_ja` / `_own`: checksums good)
objectEvents = 0x02036FF0
mapHeader = 0x02036FB8
bagPockets = 0x02039A78
battlerControllerFuncs = 0x03005AC0
handleInputChooseAction = 0x08057198
handleInputChooseMove = 0x0805780C
completeWhenChoseItem = 0x080594F0
waitForMonSelection = 0x08059438
handleInputChooseTarget = 0x08057434
monIconTable = 0x08556804
monIconPaletteIndices = 0x08556EE4
monIconPaletteTable = 0x0855709C
itemIconTable = 0x085DFCC8
pokedex = 'POKEDEX_EMERALD_JA'
guideTables = 'GUIDE_TABLES_EMERALD_JA'
