language = 'I'
gameCode = 'BPEI'
pokemonStoragePtr = 0x03005D94  # BOXES: English's (the `emerald_it` capture's boxes read, checksums good)
trainerCard = 'none'
monIconTable = 0x0857838C
monIconPaletteIndices = 0x08578A6C
monIconPaletteTable = 0x08578C24
itemIconTable = 0x08610FAC
handleInputChooseAction = 0x0805758C
handleInputChooseMove = 0x08057C00
completeWhenChoseItem = 0x080598E4
