# Gen 3 configs (hacks). The format and the commands: gamedata/README.md.

# Pokémon Team Rocket Edition: Dragonsden Version (32 MB, BPEE, sha1 40780347…, unversioned; DragonsdenTV): its own closed
# pokeemerald build (gcc) on an older pokeemerald-expansion - vanilla's struct shapes with expansion's ids (National Dex
# species to 1395, 755 moves, expansion's items). Mapped headless from a save off its Discord ("Pokemon - Team Rocket
# Edition.srm", Jason in CELADON CITY, six Pokémon Lv77-79), every address checked on the game's own screens:
# - gPlayerParty 0x02025170 / gPlayerPartyCount 0x0202516D, gEnemyParty 0x020253C8 (+0x258, as in vanilla): 100-byte
# encrypted mons with the flags folded into +0x12 ([TEAM_ROCKET_PARTY_MON]); the egg is species 1395.
# - gSaveBlock1Ptr / 2Ptr 0x0300524C / 0x03005250 (gPokemonStoragePtr after them); vanilla Emerald's SaveBlock1 up to
# money (+0x490 XOR SaveBlock2 +0xAC: ₽3,000,000, its AddMoney caps at 99,999,999).
# - gMain 0x030032E0 (vblankCounter1 +0x20 counted 16 in 16 frames), gMapHeader 0x020382D8 (mapsec 0x5E CELADON CITY;
# mapType 8 in its Pokémon Center), gObjectEvents 0x02038314 (the player's coords = pos + 7).
# - gBagPockets 0x0203ADDC: eight pockets ([TEAM_ROCKET_BAG_POCKET_ORDER]), quantities XOR the key; the battle's bag
# screen showed the Items pocket's five.
# - Battle (a scripted wild RATTATA: its setwildbattle takes a second mon's fields): gBattleTypeFlags 0x02024BB8,
# gBattlersCount 0x02024C38, gBattlerPartyIndexes 0x02024C3A, gBattlerPositions 0x02024C42, gBattleMons 0x02024C50
# ([TEAM_ROCKET_BATTLE_MON]), gBattleStruct 0x020250EC with the menus' cursors +0x10 / +0x14 (RIGHT walked the action
# cursor 0 -> 1, DOWN 1 -> 3 ran). gBattlerControllerFuncs 0x03005220: action / move / bag / party read live
# (0x08082291 / 0x08082CE1 / 0x08084D71 / 0x08084CB5), HandleInputChooseTarget 0x08082569 (HandleInputChooseMove's
# two stores). gPartyMenu 0x0203DE64 (Emerald's list, slotId +9 walked 0 -> 1 on DOWN).
# - Icons: vanilla-shaped tables from its GF ROM header (0x08000138..), sItemIconTable 0x08D3B894; gItems 0x08C833B0.
# Names / types / map sections: scripts/gen_team_rocket_tables.py.
[config.team_rocket]
base = 'emerald'
itemDescs = { preset = 'vanilla', base = 0x08C833B0, count = 923 }
playerParty = 0x02025170
playerPartyCount = 0x0202516D
enemyParty = 0x020253C8
partyMonLayout = 'TEAM_ROCKET_PARTY_MON'
battleMons = 0x02024C50
battleMonLayout = 'TEAM_ROCKET_BATTLE_MON'
battlerPositions = 0x02024C42
battlersCount = 0x02024C38
battleTypeFlags = 0x02024BB8
battlerPartyIndexes = 0x02024C3A
battleStructPtr = 0x020250EC
monToSwitchIntoOff = 0x62
actionCursor = 0x020250FC
moveCursor = 0x02025100
battlerControllerFuncs = 0x03005220
handleInputChooseAction = 0x08082291
handleInputChooseMove = 0x08082CE1
completeWhenChoseItem = 0x08084D71
waitForMonSelection = 0x08084CB5
handleInputChooseTarget = 0x08082569
partyMenu = 0x0203DE64
gMain = 0x030032E0
saveBlock1Ptr = 0x0300524C
saveBlock2Ptr = 0x03005250
objectEvents = 0x02038314
mapHeader = 0x020382D8
bagPockets = 0x0203ADDC
bagPocketCount = 8
bagPocketOrder = 'TEAM_ROCKET_BAG_POCKET_ORDER'
encryptionKeyOff = 0xAC
moneyOff = 0x490
maxMoney = 99_999_999
monIconTable = 0x08C722E8
monIconPaletteIndices = 0x08C74754
monIconPaletteTable = 0x08C75070
itemIconTable = 0x08D3B894
eggSpecies = 1395
guideTables = 'GUIDE_TABLES_TEAM_ROCKET'

# Pokémon Team Rocket Edition 2026 - Dragonsden, Spanish (32 MB, BPEE, sha1 0d8bdaee…; its START menu says v3.0.9): a rebuild
# on pokeemerald-expansion 1.14.4 (its RHHEXP block), nothing of v1.5's RAM or ROM left, so its own config. Mapped in mGBA
# from the user's save (Alex in ALMACÉN ROCKET, a Lv5 ZUBAT, ₽3128 - its FICHA ROCKET and bag screen show the same) and a
# trainer battle against its EKANS, each address checked on the game's own screens:
# - gPlayerParty 0x020395C8 (551 literal-pool words) / gPlayerPartyCount 0x02039369, gEnemyParty 0x02039370 (before the
# player's, its count at 0x0203936A): vanilla's 100-byte encrypted mon with expansion's packing (species / moves 11 bits,
# PP 7), the language at +0x12 and flags +0x13 as in vanilla. The egg is species 1698 (the header's species count).
# - gSaveBlock2Ptr / 1Ptr 0x030040EC / 0x030040F0 (gPokemonStoragePtr after them). Money SaveBlock1 +0x490 XOR
# SaveBlock2's encryption key, which this build keeps at +0x44 (the bag's empty slots read 0 through it).
# - gMain 0x03005CCC (vblankCounter1 +0x20 ran 101 in 100 frames; inBattle bit 1 of +0x439), gMapHeader 0x020011A0 (u16
# mapsec at +0x14: 0x10A ALMACÉN ROCKET, mapType 8 at +0x18), gObjectEvents 0x02000C90 (the player's coords = pos + 7).
# - gBagPockets 0x02006254: eight {ItemSlot *, capacity} by gItemsInfo's pocket (bits 3-7 of +0x1E): Items, Medicine
# (the save's POCIÓN), TMs, Key Items, Poké Balls, Battle Items, Berries, Mega Stones ([TEAM_ROCKET_V3_BAG_POCKET_ORDER]).
# - Battle (its EKANS / ZUBAT trainer): gBattleTypeFlags 0x020000A8 (0x0C trainer), gBattlersCount 0x020000AC,
# gBattleStruct 0x020000B0 with monToSwitchIntoId at +0xB0 (6 6, then [1] = 1 before its ZUBAT came out),
# gBattlerPositions 0x0200013C, gBattlerPartyIndexes 0x02000140 ([1] 0 -> 1 at the switch), the menus' cursors
# 0x020003D4 / 0x020003D8 (RIGHT / DOWN walked the action cursor 0 -> 1 -> 3, RIGHT in FIGHT the move cursor 0 -> 1),
# gBattleMons 0x0200055C ([TEAM_ROCKET_V3_BATTLE_MON]: 0x68 bytes). gBattlerControllerFuncs 0x03002EA8: action / move /
# bag / party read live (0x08054FA5 / 0x08053FC9 / 0x08052B95 / 0x08052BD5); HandleInputChooseTarget 0x08053051 by code
# (the handler before the move menu's in its literal pool, back to the move menu on B, as Dreamstone's). gPartyMenu
# 0x02038D78 (slotId +9 walked 0 -> 7, CANCEL, on DOWN with one Pokémon).
# - Icons: gSpeciesInfo 0x08970CE8 (0xA8-byte entries: iconSprite +0x68, iconPalIndex +0x86), gMonIconPaletteTable
# 0x08964C70 (the GF header's); gItemsInfo 0x088CCC1C (0x2C-byte entries: icon +0x24 smol-compressed, its palette +0x28
# plain). Names / types / moves / chart / map sections: scripts/gen_expansion_tables.py team_rocket_v3.
[config.team_rocket_v3]
base = 'emerald'
itemDescs = { base = 0x088CCC30, stride = 0x2C, descOff = -8 }
playerParty = 0x020395C8
playerPartyCount = 0x02039369
enemyParty = 0x02039370
gMain = 0x03005CCC
saveBlock1Ptr = 0x030040F0
saveBlock2Ptr = 0x030040EC
encryptionKeyOff = 0x44
moneyOff = 0x490
maxMoney = 99_999_999
objectEvents = 0x02000C90
mapHeader = 0x020011A0
mapSecWide = true
bagPockets = 0x02006254
bagPocketCount = 8
bagPocketOrder = 'TEAM_ROCKET_V3_BAG_POCKET_ORDER'
speciesMask = 0x07FF
moveMask = 0x07FF
ppMask = 0x7F
battleTypeFlags = 0x020000A8
battlersCount = 0x020000AC
battlerPartyIndexes = 0x02000140
battlerPositions = 0x0200013C
battleMons = 0x0200055C
battleMonLayout = 'TEAM_ROCKET_V3_BATTLE_MON'
battleStructPtr = 0x020000B0
monToSwitchIntoOff = 0xB0
actionCursor = 0x020003D4
moveCursor = 0x020003D8
battlerControllerFuncs = 0x03002EA8
handleInputChooseAction = 0x08054FA5
handleInputChooseMove = 0x08053FC9
completeWhenChoseItem = 0x08052B95
waitForMonSelection = 0x08052BD5
handleInputChooseTarget = 0x08053051
partyMenu = 0x02038D78
eggSpecies = 1698
monIconTable = 0x08970D50  # gSpeciesInfo[0].iconSprite
monIconStride = 0xA8
monIconPaletteIndices = 0x08970D6E  # gSpeciesInfo[0].iconPalIndex
monPalIdxStride = 0xA8
monPalIdxMask = 0x07
monIconPaletteTable = 0x08964C70
itemIconTable = 0x088CCC40  # gItemsInfo[0].iconPic
