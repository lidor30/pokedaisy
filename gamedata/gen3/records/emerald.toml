party = 'PARTY_ITEMS_EMERALD'
fly = 'FLY_EMERALD'
flight = 'FLIGHT_EMERALD'
pc = 'PC_EMERALD'

[record.PARTY_ITEMS_EMERALD]
schema = 'gen3_party_items'
