count = 50
codeCrcs = [0xBCF97BF3, 0x13BE1A7A, 0x4B625BC4, 0xF9959006, 0xB9FB85A7, 0xB037C8AF, 0x74DBCE3A, 0x2F1D18CA, 0xA284286D]
flyTypes = [2, 4]
extraMapsecs = [58]
healWarp = 'HEAL_WARP_EMERALD'

# Emerald's CB_ExitFlyMap: the heal location, Littleroot by the player's gender, else the map warp.
[record.HEAL_WARP_EMERALD]
schema = 'gen3_heal_warp'
toHealLocation = 0x08084CCC
toMapWarp = 0x08084C28
returnToField = 0x080B69DC
saveBlock2Ptr = 0x03005D90
# MAPSEC_EVER_GRANDE_CITY, MAPSEC_BATTLE_FRONTIER (HEAL_LOCATION_EVER_GRANDE_CITY, _BATTLE_FRONTIER_OUTSIDE_EAST)
special = [[15, 11], [58, 22]]
genderMapsec = 0
maleHeal = 12
femaleHeal = 13

# USE / GIVE / TAKE, the Repels, FLY and PC anywhere (FieldItems.kt's FieldItemFns): retail Emerald (BPEE). Its
# functions sit where the pinned pokeemerald build has them (Emerald Kaizo's too, retail edited in place). Every
# address from pret's pokeemerald built clean (byte for byte retail, SHA1 f3ae0881...) and its ELF. Emerald has no
# PokemonItemUseNoEffect: the no-effect check is its party menu's own, ExecuteTableBasedItemEffect, on the Pokémon
# and then undone (PartyItemFns.itemNoEffect).
[record.FIELD_ITEMS_EMERALD]
schema = 'gen3_field_items'
