# Gen 3 records (retail FireRed / LeafGreen): the Pokédex, guide, trainer-card and dex-flag tables the
# configs in gen3/retail/ name, and that the 3DS / Linux companion reads (gamedata/targets/3ds.toml).
# The format and the commands: gamedata/README.md.

# FireRed's own gBagPockets[] index order (item.c: gBagPockets[POCKET_X-1] =
# ...). Every FireRed-engine config (rev0/rev1/Unbound/Gaia/Radical Red)
# shares this - none of them are known to reorder the bag pockets array.
[list.FIRERED_BAG_POCKET_ORDER]
of = 'Int'
items = ['POCKET_ITEMS', 'POCKET_KEY_ITEMS', 'POCKET_POKE_BALLS', 'POCKET_TM_HM', 'POCKET_BERRIES']

# struct Pokedex in SaveBlock2 (+0x18: owned[52] at +0x10, seen[52] at +0x44) + SaveBlock1's two
# anti-cheat copies of seen.
[record.FIRERED_DEX_FLAGS]
schema = 'gen3_dexflags'
block = 'DexFlagBlock.SAVE_BLOCK_2'
seen = 0x5C
caught = 0x28
bytes = 52
seenCopies = [0x5F8, 0x3A18]

[record.POKEDEX_FIRERED_REV1]
schema = 'gen3_pokedex'
entries = 0x0844E8B0
