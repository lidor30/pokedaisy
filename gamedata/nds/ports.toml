# DS carts in other languages (and builds) of the supported US / Europe games: the base cart's tables with these words moved.
# scripts/gen_nds_ports.py writes the app's tables from this file (app/src/main/cpp/nds/pk_nds_ports_gen.h,
# NdsPortsGen.kt); `make gamedata` runs it and `make check` fails while they're stale.
#
# Each [[port]] is one cart by its header's game code (0x0C) and revision (0x1E):
#   kind   the GameKind it runs as;  base  whose tables it copies: heartgold (HeartGold / SoulSilver USA),
#          black (Black / White USA / Europe: Black's overlays, White's own words), black2 (Black 2 / White 2);
#   name   for logs and nds_dump;  title  the library's and the website's name (the cart's own title);
#   sha1   the whole file's (the library names the game by it);  cart  its No-Intro file name, for the tools.
# The words are named as in scripts/port_nds_fns_known.txt (what each is: pk_nds_field.cpp, pk_nds_call.cpp) and come from
# `scripts/port_nds_fns.py US.nds OTHER.nds --file ...` with the US cart's list; every one was then checked headless
# (docs/DEVELOPMENT.md's "Other languages"). Gen 5's BGM stack depth is BgmStack - 0xC in every build, so it isn't listed.
# Menu functions missing (0 / left out) mean the cart's touch-screen moments aren't followed (DsLayout.followed).

