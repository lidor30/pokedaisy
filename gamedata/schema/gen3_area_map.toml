# AREA maps (AreaMap.kt): what a game needs to draw a cave / building and its floors from the ROM.
# AreaMapTables's fields (AreaMap.kt), checked against it by scripts/gen_gamedata.py.
# type: long | int | bool | char | string | item_descs | int_range | long_list | int_list | int_set |
# long_set | int_map | ref (a Kotlin val's name);
# record names the schema of a value a config may spell out as a sub-table.

version = 1
kotlin_class = 'AreaMapTables'
kotlin_file = 'AreaMap.kt'

[field.mapGroups]
kotlin = 'Long'
type = 'long'

# XORed into each group pointer (Unbound scrambles them), 0 = plain.
[field.mapGroupsXor]
kotlin = 'Long'
type = 'long'
default = 0

[field.mapGroupSizes]
kotlin = 'List<Int>'
type = 'int_list'

[field.primaryTiles]
kotlin = 'Int'
type = 'int'

[field.primaryMetatiles]
kotlin = 'Int'
type = 'int'

[field.primaryPalettes]
kotlin = 'Int'
type = 'int'

[field.floorNumOff]
kotlin = 'Int'
type = 'int'
default = -1

# The map grid's metatile id bits, also its undefined square (0x3FF everywhere but SoulGold's 0x7FF).
[field.metatileMask]
kotlin = 'Int'
type = 'int'
default = 0x3FF
