# Host-machine ROM registry for scripts/capture_fixture_headless.sh (the
# libmgba-direct capture tool - no Android/adb/device involved at all, see
# native-capture/mgba_dump.c). Separate from roms.conf
# (device paths, for smoke_test.sh / capture_fixture.sh) since these are
# genuinely different files on a genuinely different machine.
#
# Format: key|label|rom path|save path (save path optional - omit for a
# fresh-new-game capture, e.g. a hack with no real save on file yet).
#
# `key` matches app/src/test/resources/fixtures/<key>/ like roms.conf's key
# does - the two capture paths are interchangeable as far as the JVM tests
# are concerned, they only care about the ewram.bin/iwram.bin format.
firered_vanilla|Vanilla FireRed (native RAM)|~/Downloads/Game ROMs & Emulation/gba/Pokemon - FireRed Version (USA, Europe) (Rev 1).gba|~/Documents/RetroArch/saves/mGBA/Pokemon - FireRed Version (USA, Europe) (Rev 1).srm
